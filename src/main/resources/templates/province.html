<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${province.name} + ' - 中国省市县数据'">省份详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .city-card {
            margin-bottom: 20px;
            transition: transform 0.3s;
        }
        .city-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .area-list {
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row mb-4">
            <div class="col-12">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/">首页</a></li>
                        <li class="breadcrumb-item active" aria-current="page" th:text="${province.name}">省份名称</li>
                    </ol>
                </nav>
            </div>
        </div>
        
        <div class="row">
            <div class="col-12">
                <h1 th:text="${province.name}">省份名称</h1>
                <p>代码: <span th:text="${province.code}">000000</span></p>
                <p>城市数量: <span th:text="${province.cityList.size()}">0</span></p>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <h2>城市列表</h2>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6" th:each="city : ${province.cityList}">
                <div class="card city-card">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${city.name}">城市名称</h5>
                        <p class="card-text">代码: <span th:text="${city.code}">000000</span></p>
                        <p class="card-text">区县数量: <span th:text="${city.areaList.size()}">0</span></p>
                        
                        <div th:if="${!city.areaList.empty}">
                            <h6>区县列表:</h6>
                            <div class="area-list">
                                <table class="table table-sm">
                                    <thead>
                                        <tr>
                                            <th>名称</th>
                                            <th>代码</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="area : ${city.areaList}">
                                            <td th:text="${area.name}">区县名称</td>
                                            <td th:text="${area.code}">000000</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="bg-light py-4 mt-5">
        <div class="container text-center">
            <p>数据来源: <a href="http://www.mca.gov.cn/article/sj/" target="_blank">民政部门门户网站</a></p>
            <p>GitHub: <a href="https://github.com/jworldexpo/China_Province_City" target="_blank">China_Province_City</a></p>
        </div>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
