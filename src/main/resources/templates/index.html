<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国省市县数据</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .province-card {
            margin-bottom: 20px;
            transition: transform 0.3s;
        }
        .province-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-5">中国省市县数据</h1>
                <p class="text-center mb-5">最权威最完整的中国省市县数据，数据来源于民政部门门户网站</p>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-4" th:each="province : ${provinces}">
                <div class="card province-card">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${province.name}">省份名称</h5>
                        <p class="card-text">代码: <span th:text="${province.code}">000000</span></p>
                        <p class="card-text">城市数量: <span th:text="${province.cityList.size()}">0</span></p>
                        <a th:href="@{'/province/' + ${province.code}}" class="btn btn-primary">查看详情</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="bg-light py-4 mt-5">
        <div class="container text-center">
            <p>数据来源: <a href="http://www.mca.gov.cn/article/sj/" target="_blank">民政部门门户网站</a></p>
            <p>GitHub: <a href="https://github.com/jworldexpo/China_Province_City" target="_blank">China_Province_City</a></p>
        </div>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
